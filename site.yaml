specVersion: 2
name: Stays
# Prices are in dollars, and a booking site that quotes the wrong currency is
# not a booking site.
locale: en-US
currency: USD
css: |
  /* The search bar sits on the brand band and has to read against it. */
  .fx-filters { background: var(--color-background); color: var(--color-text);
                padding: 0.75rem; border-radius: var(--radius-md) }
  .fx-filters label { font-weight: 600 }

  /* `fx-row` is a bare flex-wrap: with no basis on its children a facet rail
     and its results each take a full line. */
  .fx-row:has(.fx-facets) > .fx-stack:first-child { flex: 0 0 15rem }
  .fx-row:has(.fx-facets) > .fx-stack:last-child { flex: 1 1 22rem; min-width: 0 }

theme:
  colors:
    brand: "#003580"
    accent: "#febb02"
    surface: "#f5f5f5"
    text: "#1a1a1a"
    border: "#e7e7e7"
    background: "#ffffff"
  fonts: { body: Inter, heading: Inter }
  typeScale: { sm: 0.8125rem, md: 1rem, lg: 1.375rem, xl: 2rem }
  # max-w-7xl. A booking site is a grid of photographs; 72rem left a column of
  # empty page either side of it on any modern laptop.
  widths: { container: 80rem }
  radius: { sm: 4px, md: 8px, lg: 12px }
layout:
  header:
    # Sticky is the one thing tier 2 has no prop for; `css` is three
    # declarations on this block and reaches nothing else.
    - type: section
      css: "position: sticky; top: 0; z-index: 20"
      style:
        padding: { x: lg, y: sm }
        background: token:color.brand
        textColor: token:color.background
        contentWidth: container
      children:
        - type: stack
          style: { gap: sm }
          children:
            - type: row
              style: { justify: between, align: center, gap: md }
              children:
                - type: button
                  css: "background: none; border-radius: 0; padding: 0; font-size: 1.375rem; font-weight: 800; letter-spacing: -0.02em"
                  attrs: { label: "Stays.", to: / }
                - type: row
                  style: { gap: sm, align: center }
                  children:
                    - type: button
                      style: { variant: outline, hideOn: [base] }
                      css: "&.fx-button { color: #fff; border-color: #fff }"
                      attrs: { label: List your property, to: /partner }
                    - type: button
                      style: { variant: secondary }
                      css: "font-weight: 700"
                      attrs: { label: Sign in, to: /trips }
            # `<details>` is the native disclosure: keyboard operable, its open
            # state announced, Escape closes it, and it needs no script. The
            # links stack vertically inside it rather than scrolling sideways.
            - type: disclosure
              style: { hideOn: [sm] }
              css: "& > summary { padding: 0.35rem 0 } .fx-nav ul { flex-direction: column; gap: 0.6rem; padding: 0.5rem 0 0.25rem }"
              attrs: { label: "\u2630 Menu" }
              children:
                - { type: component, attrs: { use: site-nav } }
            - type: stack
              style: { hideOn: [base] }
              children:
                - { type: component, attrs: { use: site-nav } }
  footer:
    # Booking.com's footer shape: a container-width grid of headed link columns
    # on the page's grey, then a full-bleed navy strip for the small print.
    # Each column names its own landmark, so a screen reader hears five
    # different lists rather than five called "Main".
    - type: footer
      css: "h3 { margin: 0 } p { margin: 0 } .fx-nav ul { flex-direction: column; gap: 0.55rem }"
      style:
        background: token:color.surface
      children:
        - type: grid
          style:
            padding: { x: lg, y: xl }
            width: container
            cols: { base: 1, sm: 2, md: 3, lg: 5 }
            gap: lg
          children:
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Support, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    label: Support
                    links:
                      - { label: Manage your trips, to: /trips }
                      - { label: Book a stay, to: /book }
                      - { label: Help centre, to: /help }
                      - { label: Contact customer service, to: /contact }
                      - { label: Safety resource centre, to: /info/staying-safe }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Discover, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    label: Discover
                    links:
                      - { label: All stays, to: / }
                      - { label: Search by city, to: /search }
                      - { label: Seasonal deals, to: /deals }
                      - { label: Traveller review awards, to: /awards }
                      - { label: Travel articles, to: "/help?category=travel" }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Terms and settings, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    label: Terms and settings
                    links:
                      - { label: Privacy and cookies, to: /info/privacy-and-cookies }
                      - { label: Terms and conditions, to: /info/terms-and-conditions }
                      - { label: Partner dispute, to: /info/partner-dispute }
                      - { label: Modern slavery statement, to: /info/modern-slavery-statement }
                      - { label: Human rights statement, to: /info/human-rights-statement }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Partners, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    label: Partners
                    links:
                      - { label: List your property, to: /partner }
                      - { label: Partner help, to: /info/partner-help }
                      - { label: Become an affiliate, to: /info/become-an-affiliate }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: About, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    label: About Stays
                    links:
                      - { label: About Stays, to: /info/about-stays }
                      - { label: How we work, to: /info/how-we-work }
                      - { label: Sustainability, to: /info/sustainability }
                      - { label: Press centre, to: /info/press-centre }
                      - { label: Careers, to: /info/careers }
        - type: section
          style:
            background: token:color.brand
            textColor: token:color.background
            padding: { x: lg, y: md }
            contentWidth: container
          children:
            - type: stack
              style: { gap: xs, fontSize: sm, textAlign: center }
              children:
                - type: text
                  attrs:
                    text: Stays · a forinda-cms reference site · prices are per night
                - type: text
                  attrs:
                    text: Copyright © 1996–2026 Stays.™ All rights reserved.
access: {}
wiring:
  - key: on-arrival
    kind: payment.manual
    label: Pay at the property
    enabled: true
    config:
      instruction: Pay on arrival — the property takes cash or card.
components:
  # The same six links on a phone and on a desktop. The wrapper carries the
  # breakpoint; the component carries the list, so there is one place to add
  # the seventh link.
  - key: site-nav
    label: Site navigation
    blocks:
      - type: nav
        attrs:
          label: Main
          links:
            - { label: Stays, to: / }
            - { label: Search, to: /search }
            - { label: Deals, to: /deals }
            - { label: Awards, to: /awards }
            - { label: Your trips, to: /trips }
            - { label: Help, to: /help }
