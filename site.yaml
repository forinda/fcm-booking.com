specVersion: 2
name: Stays
# Prices are in dollars, and a booking site that quotes the wrong currency is
# not a booking site.
locale: en-US
currency: USD
theme:
  colors:
    brand: "#003580"
    accent: "#febb02"
    surface: "#f5f5f5"
    text: "#1a1a1a"
    border: "#e7e7e7"
    background: "#ffffff"
  fonts: { body: Inter, heading: Inter }
  typeScale: { sm: 0.8125rem, md: 1rem, lg: 1.375rem, xl: 2rem }
  radius: { sm: 4px, md: 8px, lg: 12px }
css: |
  /* The footer's link columns are lists, not the header's row of links, and
     .fx-nav is a wrapping row by default. Three declarations, no block owns a
     descendant selector, so this lives at site level. */
  footer .fx-nav ul { flex-direction: column; gap: 0.55rem }
  footer h3 { margin: 0 }
  footer p { margin: 0 }

  /* Sections are full-bleed bands; their contents should not be. One rule
     beats a container wrapper inside every section on every page. */
  /* max-w-7xl. One number, so the header, the bands and the footer agree. */
  .fx-section > * { max-width: 80rem; margin-inline: auto }
  footer > .fx-grid { max-width: 80rem; margin-inline: auto }

  /* The card block emits a bare image element with no size of its own. The negative
     margin bleeds it to the card's edge — it is tied to `padding: md` (1rem),
     which is what every card on this site uses. */
  .fx-card { overflow: hidden }
  .fx-card > a { color: inherit; text-decoration: none; display: block }
  .fx-card > a:hover h3 { text-decoration: underline }
  .fx-card img { width: calc(100% + 2rem); max-width: none; margin: -1rem -1rem 0.75rem;
                 aspect-ratio: 3 / 2; object-fit: cover }
  .fx-card h3 { margin: 0 0 0.25rem }

  /* Facet rails: a filter list, not a paragraph of links. */
  .fx-facets ul { list-style: none; margin: 0; padding: 0; display: flex;
                  flex-direction: column; gap: 0.4rem }
  .fx-facets li { display: flex; justify-content: space-between; gap: 1rem }
  .fx-facets li[aria-current] { font-weight: 700 }
  .fx-facet-count { color: #767676 }
  .fx-pager { display: flex; gap: 1rem; align-items: center }

  /* The search bar is the main control of the whole site and the block ships
     with no styling of its own, so it inherited the navy band it sits on and
     the browser's default submit button. */
  .fx-filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end;
                background: var(--color-background); padding: 0.75rem;
                border-radius: var(--radius-md); color: var(--color-text) }
  .fx-filters .fx-field { flex: 1 1 10rem; gap: 0.25rem }
  .fx-filters label { font-size: var(--type-sm); font-weight: 600 }
  .fx-filters input, .fx-filters select { font: inherit; width: 100%; padding: 0.55rem 0.65rem;
                border: 1px solid var(--color-border); border-radius: var(--radius-md) }
  .fx-filters button { font: inherit; font-weight: 700; cursor: pointer; border: 0;
                padding: 0.62rem 1.4rem; border-radius: var(--radius-md);
                background: var(--color-brand); color: #fff }

  /* Results next to a facet rail are a wide single column, where a full-bleed
     3:2 photo is 600px tall. Booking.com's answer is a horizontal card. */
  @media (min-width: 48rem) {
    /* A float, not grid: the image has to sit beside a variable number of text
       elements that the block wraps in nothing, and a row-spanning grid item
       inflates the rows it spans. */
    .fx-row:has(.fx-facets) .fx-card > a { display: block }
    .fx-row:has(.fx-facets) .fx-card > a::after { content: ""; display: block; clear: both }
    .fx-row:has(.fx-facets) .fx-card img { float: left; width: 15rem; height: 11rem;
                object-fit: cover; aspect-ratio: auto; max-width: none;
                margin: -1rem 1rem 0.5rem -1rem }
  }

  /* A facet rail beside its results, not stacked above them. `fx-row` is a
     bare flex-wrap with no basis on its children, so both columns took a line. */
  .fx-row:has(.fx-facets) > .fx-stack:first-child { flex: 0 0 15rem }
  .fx-row:has(.fx-facets) > .fx-stack:last-child { flex: 1 1 22rem; min-width: 0 }

  /* A button in a stack is stretched by the stack's default `align-items`. */
  .fx-stack > .fx-button, .fx-stack > .fx-form { align-self: flex-start }

  /* The site header. `a { color: brand }` from the baseline put navy links on
     a navy band — invisible on every page until now. */
  body > .fx-section:first-child { position: sticky; top: 0; z-index: 20 }
  body > .fx-section:first-child .fx-nav a { color: #fff }
  body > .fx-section:first-child .fx-nav ul { gap: 1.25rem; font-size: 0.9375rem; font-weight: 600 }
  body > .fx-section:first-child .fx-button { border-radius: var(--radius-md) }

  /* Forms. The baseline gives them a layout; these give them a finish. */
  .fx-form { gap: 1rem; max-width: 40rem; width: 100% }
  .fx-field label { font-size: var(--type-sm); font-weight: 600 }
  .fx-field input, .fx-field textarea, .fx-field select { background: var(--color-background);
                padding: 0.7rem 0.75rem; border-radius: var(--radius-md) }
  .fx-field input:focus, .fx-field textarea:focus, .fx-field select:focus,
  .fx-filters input:focus, .fx-filters select:focus { outline: 2px solid var(--color-accent);
                outline-offset: 1px; border-color: var(--color-brand) }
  .fx-form button { padding: 0.75rem 1.5rem; font-weight: 700 }
layout:
  header:
    # Two rows, like booking.com: identity and account actions on top, the
    # product nav under it. One `nav` landmark, not four.
    - type: section
      style:
        padding: { x: lg, y: sm }
        background: token:color.brand
        textColor: token:color.background
      children:
        - type: stack
          style: { gap: sm }
          children:
            - type: row
              style: { justify: between, align: center, gap: md }
              children:
                - type: button
                  css: "background:none;border-radius:0;padding:0;font-size:1.375rem;font-weight:800;letter-spacing:-0.02em"
                  attrs: { label: "Stays.", to: / }
                - type: row
                  style: { gap: sm, align: center }
                  children:
                    - type: button
                      css: "background:none;border:1px solid rgba(255,255,255,0.45);padding:0.4rem 0.8rem;font-size:0.875rem;font-weight:600"
                      attrs: { label: List your property, to: /partner }
                    - type: button
                      css: "background:#fff;color:#003580;padding:0.4rem 0.9rem;font-size:0.875rem;font-weight:700"
                      attrs: { label: Sign in, to: /trips }
            - type: nav
              attrs:
                links:
                  - { label: Stays, to: / }
                  - { label: Search, to: /search }
                  - { label: Deals, to: /deals }
                  - { label: Awards, to: /awards }
                  - { label: Your trips, to: /trips }
                  - { label: Help, to: /help }
  footer:
    # Booking.com's footer shape: a container-width grid of headed link columns
    # on the page's grey, then a full-bleed navy strip for the small print.
    - type: footer
      style:
        background: token:color.surface
      children:
        - type: grid
          style:
            padding: { x: lg, y: xl }
            cols: { base: 1, sm: 2, md: 3, lg: 5 }
            gap: lg
          children:
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Support, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    links:
                      - { label: Manage your trips, to: /trips }
                      - { label: Book a stay, to: /book }
                      - { label: Help centre, to: /help }
                      - { label: Contact customer service, to: /contact }
                      - { label: Safety resource centre, to: /info/staying-safe }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Discover, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    links:
                      - { label: All stays, to: / }
                      - { label: Search by city, to: /search }
                      - { label: Seasonal deals, to: /deals }
                      - { label: Traveller review awards, to: /awards }
                      - { label: Travel articles, to: /help?category=travel }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Terms and settings, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    links:
                      - { label: Privacy and cookies, to: /info/privacy-and-cookies }
                      - { label: Terms and conditions, to: /info/terms-and-conditions }
                      - { label: Partner dispute, to: /info/partner-dispute }
                      - { label: Modern slavery statement, to: /info/modern-slavery-statement }
                      - { label: Human rights statement, to: /info/human-rights-statement }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: Partners, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    links:
                      - { label: Partner help, to: /info/partner-help }
                      - { label: List your property, to: /partner }
                      - { label: Become an affiliate, to: /info/become-an-affiliate }
            - type: stack
              style: { gap: sm, fontSize: sm }
              children:
                - type: heading
                  attrs: { text: About, level: 3 }
                  style: { fontSize: sm, fontWeight: bold }
                - type: nav
                  attrs:
                    links:
                      - { label: About Stays, to: /info/about-stays }
                      - { label: How we work, to: /info/how-we-work }
                      - { label: Sustainability, to: /info/sustainability }
                      - { label: Press centre, to: /info/press-centre }
                      - { label: Careers, to: /info/careers }
        - type: section
          style:
            background: token:color.brand
            textColor: token:color.background
            padding: { x: lg, y: md }
          children:
            - type: stack
              style: { gap: xs, fontSize: sm, textAlign: center }
              children:
                - type: text
                  attrs:
                    text: Stays · a forinda-cms reference site · prices are per night
                - type: text
                  attrs:
                    text: Copyright © 1996–2026 Stays.™ All rights reserved.
access: {}
wiring:
  - key: on-arrival
    kind: payment.manual
    label: Pay at the property
    enabled: true
    config:
      instruction: Pay on arrival — the property takes cash or card.
components: []
