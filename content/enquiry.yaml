key: enquiry
label: Enquiry
labelPlural: Enquiries
titleField: name
publishable: false
# `anyone`: a guest with a problem does not have an account yet, and a contact
# form behind a sign-in is a contact form nobody uses. Declared here rather than
# implied by the form block, so opening the type to public writes shows in the diff.
submissions: anyone
fields:
  # A select renders as a select now, so the topic stops being a free-text box
  # somebody has to read and route by hand.
  - name: topic
    label: What is this about?
    type: select
    required: true
    unique: false
    filterable: true
    options:
      - { value: booking, label: A booking I have made }
      - { value: property, label: A property listed here }
      - { value: list-a-property, label: Listing my property }
      - { value: affiliate, label: The affiliate programme }
      - { value: press, label: Press }
      - { value: careers, label: Careers }
      - { value: other, label: Something else }
  - name: name
    label: Your name
    type: text
    required: true
    unique: false
    filterable: false
  - name: email
    label: Email address
    type: email
    required: true
    unique: false
    filterable: false
  - name: subject
    label: What is this about?
    type: text
    required: true
    unique: false
    filterable: true
  - name: reference
    label: Booking reference (if you have one)
    type: text
    required: false
    unique: false
    filterable: false
  - name: message
    label: Message
    type: richtext
    required: true
    unique: false
    filterable: false
